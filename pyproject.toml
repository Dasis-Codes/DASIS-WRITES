[project]
name = "dasis-writes"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask",
    "Flask-SQLAlchemy",
    "Flask-Bcrypt",
    "Flask-Login",
    "Flask-Mail",
    "bleach",
    "beautifulsoup4",
    "tinycss2",
    "psycopg2-binary",
    "email-validator",
    "python-dotenv"
]

[tool.vercel]
entrypoint = "run:app"